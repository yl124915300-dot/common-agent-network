name: Read existing AI Daily Savings Worker (encrypted backup only)

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ads-intake-readback.yml']

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check approved account and read worker source
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "No Cloudflare token configured in this repository"; exit 2; fi
          http_code=$(curl --silent --show-error --location --max-time 25 --retry 1 -o /tmp/worker-source.bin -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/3d43f0a97ce41734cf2ed3193112279b/workers/scripts/ai-daily-savings-intake")
          if [ "$http_code" != "200" ]; then echo "Worker read denied or unavailable; HTTP ${http_code}. No deployment attempted."; exit 3; fi
          echo "Cloudflare Worker read succeeded (source withheld from public logs)."
      - name: Encrypt snapshot to one-time public key
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const worker = fs.readFileSync('/tmp/worker-source.bin');
          if (worker.length < 100 || worker.length > 2000000) throw new Error('Unexpected source size; refusing to archive');
          const publicKey = "-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAuQBKizr5M5ponaApKLEq\n4g4U4NQyuZOadqI6V2K6ozZlPjwXAXS81x+6N0twP51/HxT8G5C4pijD2Qn1Rojs\ngBlHuaj8XKPa7gBQyXA63wPlpCaeIE26mbJSTF5rCeu0bVOfieG/WCpr/5P43d69\nHBGjxIruQ+mzCuDQhEfZa6RgoILYnFpt3Q+mViYMo9RPYY5+6U/HFW4hc3LPt6HL\ny9JVESZnVANgS76aoVgPQj0Oh5hZbuNr6xN2qiMywg6WvYaVWkqnR0XAsdsfrtQV\n9gjlwALmltwfQLGGWI1+ZDMgNLIZ9royr4yUKJb8pkUpWXleC/1yYIjAjxt+yUbV\nGkEL0aoM7ZJSI1/OU5tE4FQv/ZdzBmdYEV2b8NsCVJJVC+2rIHJO+5NzB3dD1WPN\nDTgXlqNTb0+VuXIsSugOdnSwdhyHChlJCrvVERODKcMqpiyih+RQxy/xEbzDPHER\nTVFI7VE8HYBH7eEmR6gd4MgNQJv+MRea/U9SAsN7L11HAgMBAAE=\n-----END PUBLIC KEY-----";
          const key = crypto.randomBytes(32), iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const encrypted = Buffer.concat([cipher.update(worker), cipher.final()]);
          const wrapped = crypto.publicEncrypt({key:publicKey,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
          const pack = {format:'AES-256-GCM-RSA-OAEP-SHA256',ciphertext:encrypted.toString('base64'),nonce:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),wrappedKey:wrapped.toString('base64'),sha256:crypto.createHash('sha256').update(worker).digest('hex'),length:worker.length};
          fs.writeFileSync('/tmp/worker.encrypted.json', JSON.stringify(pack));
          console.log('Encrypted Worker snapshot prepared. Exact source not printed. Length:',worker.length);
          NODE
      - name: Upload encrypted diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-savings-source-encrypted
          path: /tmp/worker.encrypted.json
          retention-days: 1
          if-no-files-found: error
